name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.3']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: ctype, iconv, pdo_pgsql
        coverage: pcov
        ini-values: post_max_size=256M

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Create test database
      run: php bin/console doctrine:database:create --env=test --if-not-exists
      env:
        DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/app?serverVersion=16

    - name: Generate migration
      run: php bin/console doctrine:migrations:diff --env=test || true
      env:
        DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/app?serverVersion=16

    - name: Execute migrations
      run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
      env:
        DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/app?serverVersion=16

    - name: Run PHPUnit tests (empty DB)
      run: php bin/phpunit --exclude-group needs-fixtures --coverage-text
      env:
        DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/app?serverVersion=16

    - name: Load fixtures
      run: php bin/console doctrine:fixtures:load --env=test --no-interaction --purge-with-truncate
      env:
        DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/app?serverVersion=16

    - name: Run PHPUnit tests (with fixtures)
      run: php bin/phpunit --coverage-text
      env:
        DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/app?serverVersion=16

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: ctype, iconv

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build assets
      run: npm run build
