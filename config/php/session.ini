; Session configuration for Scorea
; This ensures sessions are kept alive long enough for normal user workflows

; Garbage collection: collect after 30 minutes of inactivity (1800 seconds)
session.gc_maxlifetime=1800

; Session ID valid in browser for 30 minutes (1800 seconds)
session.cookie_lifetime=1800

; Don't regenerate on every request (can cause session loss with high traffic)
session.use_strict_mode=1
